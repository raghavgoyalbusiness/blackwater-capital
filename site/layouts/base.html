<!doctype html>
<html lang="en-GB" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="theme-color" content="#090B0D">
<meta name="robots" content="index, follow, max-image-preview:large">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Blackwater Capital">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{CANONICAL_ORIGIN}}/assets/img/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/icon-192.png">
<link rel="manifest" href="/assets/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&family=Inter:wght@300..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&family=Inter:wght@300..600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..500&family=Inter:wght@300..600&display=swap"></noscript>

<link rel="stylesheet" href="/assets/css/site.css">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
<script type="application/ld+json">{{JSONLD}}</script>
{{HEAD_EXTRA}}
</head>
<body class="{{BODY_CLASS}}" data-nav="{{NAV_KEY}}" data-hero-theme="{{HERO_THEME}}">
<a class="skip-link" href="#main">Skip to main content</a>
{{> header}}
<main id="main" tabindex="-1">
{{CONTENT}}
</main>
{{> footer}}
{{> cookie}}
<script src="/assets/js/site.js" defer></script>
{{SCRIPTS}}
</body>
</html>
