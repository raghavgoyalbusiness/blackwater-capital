<div class="cookie" id="cookie" role="dialog" aria-modal="false" aria-labelledby="cookie-title" hidden data-cookie>
  <div class="cookie__inner">
    <div class="cookie__text">
      <h2 class="cookie__title" id="cookie-title">Cookies</h2>
      <p>We use essential cookies to make this website work. With your consent we would also use
      analytics cookies to understand how the site is used. You can change your choice at any time
      on our <a href="/privacy">Privacy Policy</a> page.</p>
    </div>
    <div class="cookie__actions">
      <button class="btn btn--ghost-light btn--sm" type="button" data-cookie-decline>Essential only</button>
      <button class="btn btn--light btn--sm" type="button" data-cookie-accept>Accept all</button>
    </div>
  </div>
</div>
